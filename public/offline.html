<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#244c3a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline — HomelyBlock</title>
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f0;
        --fg: #303b35;
        --muted: #5c675e;
        --forest: #244c3a;
        --surface: #ffffff;
        --border: #e5e7e1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121916;
          --fg: #f7f6f0;
          --muted: #c5d1c9;
          --forest: #dce8de;
          --surface: #1c2621;
          --border: #6a7c72;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      }
      main {
        width: min(28rem, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        width: 3rem;
        height: 3rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        background: #244c3a;
        color: #f7f6f0;
        margin-bottom: 1rem;
      }
      .mark svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.55;
      }
      button {
        margin-top: 1.35rem;
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: #244c3a;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.7rem 1.15rem;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #dce8de;
          color: #1b3c2c;
        }
      }
      button:focus-visible {
        outline: 2px solid var(--forest);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1Z" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>
        HomelyBlock needs an internet connection for live society data, memberships, billing, and
        notices. Private records are not stored for offline use.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          window.location.href = "/";
        }
      });
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
